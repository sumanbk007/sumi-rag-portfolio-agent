services:
  - type: web
    name: suman-portfolio-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/ingest.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: models/text-embedding-004
      - key: CHAT_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        sync: false
      - key: INDEX_DIR
        value: ./app/data/index
